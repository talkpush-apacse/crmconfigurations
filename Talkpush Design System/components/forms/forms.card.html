<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{padding:20px;background:var(--surface-page)}.row{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-end;margin-bottom:16px}.row>*{width:200px}</style>
<div id="root"></div>
<script type="text/babel">
const { Input, Select, Checkbox, Switch } = window.TalkpushDesignSystem_0ed2b8;
function Demo(){
  const [checked, setChecked] = React.useState(true);
  const [on, setOn] = React.useState(true);
  return (
    <div>
      <div className="row">
        <Input label="Full name" placeholder="Jane Cruz" />
        <Input label="Email" error="Enter a valid email" />
        <Select label="Region" options={['Philippines','Colombia','Egypt']} />
      </div>
      <div className="row" style={{alignItems:'center'}}>
        <Checkbox label="Checked" checked={checked} onChange={e=>setChecked(e.target.checked)} />
        <Checkbox label="Unchecked" checked={false} />
        <Switch label="Notifications" checked={on} onChange={e=>setOn(e.target.checked)} />
        <Switch label="Off" checked={false} />
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script>
