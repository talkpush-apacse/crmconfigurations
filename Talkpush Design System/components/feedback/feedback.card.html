<style>body{padding:40px;background:var(--surface-page)}</style>
<div id="root"></div>
<script type="text/babel">
const { Tooltip, Dialog, Button } = window.TalkpushDesignSystem_0ed2b8;
function Demo(){
  const [open, setOpen] = React.useState(false);
  return (
    <div style={{display:'flex',gap:24,alignItems:'center'}}>
      <Tooltip label="Download as PDF"><Button variant="outline">Hover me</Button></Tooltip>
      <Button variant="cta" onClick={()=>setOpen(true)}>Open dialog</Button>
      <Dialog open={open} title="Confirm signature" onClose={()=>setOpen(false)}
        footer={<><Button variant="ghost" onClick={()=>setOpen(false)}>Cancel</Button><Button variant="cta" onClick={()=>setOpen(false)}>Sign</Button></>}>
        This action cannot be undone.
      </Dialog>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script>
