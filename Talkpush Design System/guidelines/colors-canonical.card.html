<!-- @dsCard group="Colors" viewport="700x190" name="Canonical accents" subtitle="Beige surface, ink text, four accent colors" -->
<link rel="stylesheet" href="../styles.css">
<style>
body{padding:20px;font-family:var(--font-body)}
.row{display:flex;gap:10px}
.sw{flex:1;height:84px;border-radius:var(--radius-md);display:flex;flex-direction:column;justify-content:flex-end;padding:8px 10px;color:var(--color-ink)}
.sw span{font-size:11px;font-weight:600}
.sw small{display:block;font-size:10px;opacity:.75;font-variant-numeric:tabular-nums}
.on-ink{color:#fff}
</style>
<div class="row">
<div class="sw on-ink" style="background:var(--color-ink)"><span>Ink</span><small>#1a1a1a</small></div>
<div class="sw" style="background:var(--color-beige);border:1px solid var(--color-line)"><span>Beige (page)</span><small>#FFFFF5</small></div>
<div class="sw" style="background:var(--color-green)"><span>Green</span><small>#ACCDB5</small></div>
<div class="sw" style="background:var(--color-blue)"><span>Blue</span><small>#BBCAF0</small></div>
<div class="sw" style="background:var(--color-pink)"><span>Pink</span><small>#E8C2EF</small></div>
<div class="sw" style="background:var(--color-orange)"><span>Orange</span><small>#E8B766</small></div>
</div>
