<link rel="stylesheet" href="../styles.css">
<style>
body{padding:20px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.sw{height:44px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:600;color:var(--color-ink)}
</style>
<div class="grid">
<div class="sw" style="background:var(--color-green-lightest)">Green lightest</div>
<div class="sw" style="background:var(--color-green-darker);color:#fff">Green darker</div>
<div class="sw" style="background:var(--color-blue-lightest)">Blue lightest</div>
<div class="sw" style="background:var(--color-blue-darker);color:#fff">Blue darker</div>
<div class="sw" style="background:var(--color-pink-lightest)">Pink lightest</div>
<div class="sw" style="background:var(--color-pink-darker)">Pink darker</div>
<div class="sw" style="background:var(--color-orange-lightest)">Orange lightest</div>
<div class="sw" style="background:var(--color-orange-darker)">Orange darker</div>
</div>
