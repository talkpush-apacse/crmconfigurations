<!-- @dsCard group="Colors" viewport="700x180" name="Semantic usage" subtitle="One accent per meaning, held consistently" -->
<link rel="stylesheet" href="../styles.css">
<style>
body{padding:18px;font-family:var(--font-body)}
.row{display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid var(--color-line);font-size:13px}
.row:last-child{border-bottom:none}
.dot{width:12px;height:12px;border-radius:50%;flex:none}
.meaning{color:var(--text-muted);margin-left:auto;font-size:12px}
</style>
<div class="row"><div class="dot" style="background:var(--color-green)"></div>Resolved, completed, success, growth<span class="meaning">Green</span></div>
<div class="row"><div class="dot" style="background:var(--color-blue)"></div>In progress, neutral info, third category<span class="meaning">Blue</span></div>
<div class="row"><div class="dot" style="background:var(--color-pink)"></div>Second category, phase, CTA highlight<span class="meaning">Pink</span></div>
<div class="row"><div class="dot" style="background:var(--color-orange)"></div>Created, new, pending, in-progress warning<span class="meaning">Orange</span></div>
<div class="row"><div class="dot" style="background:var(--color-alert-amber)"></div>Aging 14+ days<span class="meaning">Amber (derived)</span></div>
<div class="row"><div class="dot" style="background:var(--color-alert-red)"></div>Aging 30+ days<span class="meaning">Red (derived)</span></div>
